services:
  mysql:
    image: mysql:8.4
    container_name: partay-mysql
    environment:
      MYSQL_DATABASE: partay
      MYSQL_USER: partay
      MYSQL_PASSWORD: partay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - partay-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
volumes:
  partay-mysql-data:
